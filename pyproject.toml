[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "future_admirer"
version = "1.0.0"
description = "Future Admiral Researcher - Autonomous Multi-Agent Algorithmic Trading Intelligence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.81",
    "langchain-openai>=0.2.0",
    "pandas>=2.3.0",
    "python-dotenv>=1.0.0",
    "questionary>=2.1.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "stockstats>=0.6.5",
    "yfinance>=1.4.1",
    "tabulate>=0.9.0",
]

[project.scripts]
admirer = "future_admirer.cli:app"

[tool.setuptools.packages.find]
include = ["future_admirer*"]
exclude = ["reports*"]